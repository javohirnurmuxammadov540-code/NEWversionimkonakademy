<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imkoniyatlar akademiyasi — Logopediya</title>
<style>
:root{--ink:#14284b;--muted:#5a6b8c;--p:#0fa3a3;--p2:#3ccfcf;--pale:#e6f7f7;--co:#ff7a6b;--sun:#ffc23d;--vio:#7c6cf0;--line:#dfeaf0;--bg:#f7fcfd;--card:#fff;--r:24px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8f1ff;--muted:#a3b3d1;--pale:#12303a;--line:#223a4d;--bg:#0b1722;--card:#112332}}
html{scroll-behavior:smooth;scroll-padding-top:84px;height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:"Segoe UI",Inter,system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}.wrap{width:min(1140px,92%);margin:auto}
@keyframes fl{50%{transform:translateY(-14px)}}@keyframes rg{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}@keyframes gr{to{background-position:200% 0}}
@keyframes sh{to{transform:translateX(260%) skewX(-20deg)}}@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes bl{50%{opacity:0}}@keyframes wg{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}@keyframes in{from{opacity:0;transform:translateY(16px)}}
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:70px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;line-height:1.1;font-size:16px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--vio));display:grid;place-items:center;font-size:24px;animation:wg 3s ease-in-out infinite}
.links{display:flex;gap:4px;font-size:14px;font-weight:600}.links a{padding:8px 12px;border-radius:12px;transition:.2s}.links a:hover{background:var(--pale);color:var(--p)}
.lang{display:flex;background:var(--pale);border-radius:99px;padding:3px}.lang button{border:0;background:none;font:inherit;font-weight:800;font-size:13px;padding:7px 13px;border-radius:99px;cursor:pointer;color:var(--muted);transition:.25s}.lang button.on{background:var(--p);color:#fff;box-shadow:0 4px 12px #0fa3a355}
.mb{display:none}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:14px 24px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--vio));color:#fff;box-shadow:0 10px 26px #0fa3a345;transition:.25s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:#fff5;transform:skewX(-20deg);animation:sh 3.2s infinite}
.btn:hover{transform:translateY(-3px)}.btn.s{background:var(--card);color:var(--p);border:1px solid var(--line);box-shadow:none}.btn.s::after{display:none}
.hero{position:relative;padding:70px 0 70px;overflow:hidden;background:radial-gradient(circle at 90% 10%,#bff3f0 0,transparent 35%),radial-gradient(circle at 5% 90%,#ffe0da 0,transparent 32%),linear-gradient(135deg,var(--bg),var(--pale))}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.eb{display:inline-flex;gap:8px;background:var(--pale);color:var(--p);padding:8px 15px;border-radius:99px;font-size:13px;font-weight:800}
h1{font-size:clamp(36px,5.2vw,62px);line-height:1.05;letter-spacing:-2px;margin:20px 0 16px}
h1 span{background:linear-gradient(90deg,var(--p),var(--vio),var(--co),var(--p));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gr 6s linear infinite}
.hero p.l{color:var(--muted);font-size:17.5px;max-width:600px}.acts{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 14px}.sm{font-size:12.5px;color:var(--muted)}
.badge{display:inline-flex;gap:6px;background:#fff3d6;color:#8a5a00;font-size:12px;font-weight:800;padding:4px 11px;border-radius:99px}
.art{position:relative;aspect-ratio:1;max-width:430px;margin:auto;width:100%;display:grid;place-items:center}
.ring{position:absolute;inset:18%;border-radius:50%;border:3px solid var(--p2);animation:rg 3.6s ease-out infinite}.ring:nth-child(2){animation-delay:1.2s}.ring:nth-child(3){animation-delay:2.4s}
.core{position:relative;width:46%;aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--vio));display:grid;place-items:center;font-size:clamp(48px,8vw,80px);box-shadow:0 24px 60px #0fa3a355;animation:fl 4s ease-in-out infinite}
.bub{position:absolute;background:var(--card);border-radius:18px 18px 18px 4px;padding:10px 16px;font-weight:800;box-shadow:0 14px 34px #14284b22;font-size:15px;animation:fl 4s ease-in-out infinite}
.bub.b1{top:6%;left:0}.bub.b2{bottom:10%;right:-2%;border-radius:18px 18px 4px 18px;animation-delay:-2s;color:var(--co)}
.bub i{display:inline-block;width:2px;height:1em;background:var(--p);margin-left:3px;vertical-align:-.15em;animation:bl 1s infinite}
.lt{position:absolute;font-weight:900;font-size:34px;animation:fl 5s ease-in-out infinite;opacity:.9}
.wave{position:absolute;bottom:-6%;display:flex;gap:5px;align-items:center;height:50px}.wave b{width:6px;height:100%;border-radius:9px;background:linear-gradient(var(--p2),var(--vio));animation:wv 1.1s ease-in-out infinite}
.stats{margin-top:-30px;position:relative;z-index:2}.sr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 20px 50px #14284b14}
.stat{display:flex;gap:14px;align-items:center;padding:6px 12px}.stat em{font-style:normal;font-size:38px;animation:fl 3s ease-in-out infinite}.stat b{display:block;font-size:18px;line-height:1.25}.stat span{font-size:13px;color:var(--muted)}
.sec{padding:74px 0}.sh{max-width:700px;margin-bottom:30px}.sh h2{font-size:clamp(28px,3.4vw,40px);line-height:1.12;letter-spacing:-1px;margin:0 0 10px}.sh p{color:var(--muted);margin:0}
.tag{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--p);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;transition:transform .3s,box-shadow .3s;transform-style:preserve-3d}
.card:hover{box-shadow:0 26px 50px #0fa3a326;border-color:var(--p2)}.card .ic{width:62px;height:62px;border-radius:20px;background:var(--pale);display:grid;place-items:center;font-size:34px;margin-bottom:16px;transition:.4s}.card:hover .ic{transform:rotate(-10deg) scale(1.12)}
.card h3{margin:0 0 8px;font-size:18px}.card p{margin:0;font-size:14.5px;color:var(--muted)}
.soft{background:var(--pale)}.two{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:start}
.steps{display:grid;gap:12px}.step{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);padding:16px;border-radius:18px;transition:.25s}.step:hover{transform:translateX(6px);border-color:var(--p2)}
.num{flex:0 0 38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--vio));color:#fff;display:grid;place-items:center;font-weight:800}.done .num{background:var(--co)}
.step h3{font-size:15.5px;margin:0 0 2px}.step p{font-size:14px;color:var(--muted);margin:0}
.app{background:var(--card);border:1px solid var(--line);border-radius:32px;padding:34px;box-shadow:0 28px 70px #0fa3a31c;min-height:380px}.app>*{animation:in .5s both}
.prog{height:10px;background:var(--pale);border-radius:99px;overflow:hidden;margin-bottom:8px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--co));border-radius:99px;transition:width .6s}
.qn{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:16px}.app h3{font-size:clamp(21px,2.6vw,28px);line-height:1.25;margin:0 0 20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{font:inherit;text-align:left;padding:16px 18px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;color:var(--ink);transition:.2s}.opt:hover,.opt.sel{border-color:var(--p);background:var(--pale);transform:translateY(-3px)}
.ctr{text-align:center;max-width:560px;margin:auto}.ctr .big{font-size:84px;display:block;animation:fl 3s infinite}.ctr p{color:var(--muted)}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.row.c{justify-content:center}
.link{background:none;border:0;font:inherit;font-weight:700;color:var(--p);cursor:pointer;padding:8px}
.dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.dir{position:relative;font:inherit;text-align:left;padding:24px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;transition:.25s;color:var(--ink)}
.dir:hover:not(.lock){transform:translateY(-6px);border-color:var(--p);box-shadow:0 20px 40px #0fa3a326}.dir em{font-style:normal;font-size:46px;display:block;margin-bottom:10px}.dir b{display:block;font-size:18px;margin-bottom:6px}.dir span.d{font-size:13.5px;color:var(--muted)}.dir.lock{opacity:.55;cursor:not-allowed}.dir .badge{position:absolute;top:14px;right:14px}
.tips{display:grid;gap:10px;margin:0 0 26px;padding:0;list-style:none}.tips li{display:flex;gap:12px;background:var(--pale);border-radius:16px;padding:14px 16px;font-size:14.5px}.tips em{font-style:normal;font-size:22px}
.vg{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.vid{border:1px solid var(--line);border-radius:22px;overflow:hidden}.vb{aspect-ratio:16/9;background:linear-gradient(135deg,var(--pale),#ffe7e2);display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px}.vb video,.vb iframe{width:100%;height:100%;border:0}.vb em{font-style:normal;font-size:50px;display:block;animation:fl 3s infinite}
.vi{padding:16px 18px}.vi h4{margin:0 0 4px}.vi p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.stars{display:flex;align-items:center}.stars button{border:0;background:none;font-size:28px;cursor:pointer;color:#c8d3dd;padding:2px;transition:.15s}.stars button.on{color:var(--sun);animation:pop .4s}.stars button:hover{transform:scale(1.25)}.stars small{margin-left:8px;color:var(--muted);font-size:12px}
.fb{margin-top:26px;background:var(--pale);border-radius:22px;padding:22px}.fb h4{margin:0 0 8px}textarea{font:inherit;width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:13px;padding:13px;background:var(--card);color:var(--ink);margin:12px 0}textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px #0fa3a322}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}.kpi b{font-size:34px;display:block;line-height:1.1}.kpi span{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}th{background:var(--pale);font-size:12px;text-transform:uppercase}
.bar{height:8px;background:var(--pale);border-radius:99px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--p);transition:width .8s}
.foot{background:linear-gradient(135deg,#0b3b4a,#2b2a78);color:#e6f4ff;padding:44px 0}.fg{display:flex;justify-content:space-between;gap:28px;flex-wrap:wrap}.foot p{margin:5px 0;color:#bcd2ea;font-size:13px}
.rv{opacity:0;transform:translateY(30px);transition:opacity .7s,transform .7s}.rv.on{opacity:1;transform:none}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hg,.two,.sr,.dirs,.dash,.vg,.opts{grid-template-columns:1fr}}
@media(max-width:700px){.links{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--bg);padding:10px 4%;border-bottom:1px solid var(--line)}.links.open{display:flex}.mb{display:inline-flex;padding:10px 14px}.grid{grid-template-columns:1fr}.sec{padding:52px 0}.app{padding:22px}.brand span.t{display:none}}
.logo,.core,.bub,.lt,.stat em,.ctr .big,.vb em,.dir em,h1 span{animation:none!important}.btn::after{display:none}
.em{width:1em;height:1em;display:inline-block;vertical-align:-.14em;overflow:visible}
.pill{display:inline-block;font-size:12px;background:var(--pale);color:var(--muted);border-radius:99px;padding:4px 10px;margin-top:12px}
.vc textarea{min-height:64px;margin:10px 0 8px}.vl{display:grid;gap:6px;margin-top:10px}.vl h4{margin:0 0 2px}.vl p{margin:0;background:var(--pale);border-radius:12px;padding:8px 12px;font-size:13px}.vl small{display:block;color:var(--muted);font-size:11px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
